<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img">
<title>A bump is infinitesimal relative to a long translation</title>
<desc>In the plane: the diagonal y = x, the graph of a bump b that is the identity outside [a, c] and above the diagonal inside, its power b squared inside [a, c] and closer to the corner, and the line y = x + d with d at least c minus a, which lies above every power; b to the n is below t_d for every n.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="70" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="34" fill="#1a1a1a" font-weight="bold" text-anchor="start">A bump is infinitesimal relative to a long translation</text>
<text x="60" y="112" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#555555" text-anchor="start">b is the identity outside [a, c] and above the diagonal inside;   t_d(x) = x + d,  d ≥ c − a</text>
