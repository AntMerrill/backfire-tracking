<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1180" font-family="Inter, 'IBM Plex Sans', Arial, sans-serif"><rect width="1080" height="1180" fill="rgb(250,248,243)"/><text x="40" y="64.1" font-size="44" font-weight="700" fill="rgb(25,25,30)" xml:space="preserve">Only the rigid grid with relays has an m</text><text x="40" y="104.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">Nine Holland objects. m by ownership = the owner whose own posts hold every recurring guest&#x27;s whole row.</text><text x="40" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">object</text><text x="290" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">shape</text><text x="520" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">v × b</text><text x="640" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">m</text><text x="845" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">guests held</text><text x="965" y="164.8" font-size="18" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">λ</text><text x="40" y="202.0" font-size="22" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">Has an m</text><rect x="30" y="214" width="1020" height="136" fill="rgb(232,242,234)"/><text x="40" y="242.4" font-size="20" font-weight="700" fill="rgb(25,25,30)" xml:space="preserve">S_h, LDA&#x27;s grid</text><text x="290" y="242.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">P1 rigid grid</text><text x="520" y="242.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">113 × 354</text><text x="640" y="242.4" font-size="20" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">LDA</text><text x="845" y="242.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">79/79</text><text x="965" y="242.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">not equal</text><text x="40" y="288.4" font-size="20" font-weight="700" fill="rgb(25,25,30)" xml:space="preserve">Chadverse core</text><text x="290" y="288.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">P1 relay p1→h→p2</text><text x="520" y="288.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">14 × 7</text><text x="640" y="288.4" font-size="20" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">latterdayavenger</text><text x="845" y="288.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">5/5</text><text x="965" y="288.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">not equal</text><text x="40" y="334.4" font-size="20" font-weight="700" fill="rgb(25,25,30)" xml:space="preserve">S16, Holland 24</text><text x="290" y="334.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">same shape (P2)</text><text x="520" y="334.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">15 × 16</text><text x="640" y="334.4" font-size="20" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">expofamily.cl</text><text x="845" y="334.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">3/3</text><text x="965" y="334.4" font-size="20" font-weight="700" fill="rgb(190,30,40)" xml:space="preserve">2, 2, 2</text><text x="40" y="394.0" font-size="22" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">No m</text><text x="40" y="434.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">TB × druze.spirit</text><text x="290" y="434.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">twin frame</text><text x="520" y="434.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">10 × 36</text><text x="640" y="434.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="434.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">best 2/6</text><text x="965" y="434.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="40" y="480.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">druze.spirit timeline</text><text x="290" y="480.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">frame + guests</text><text x="520" y="480.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">108 × 200</text><text x="640" y="480.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="480.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">best 11/47</text><text x="965" y="480.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="40" y="526.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">mario co-posters</text><text x="290" y="526.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">frame</text><text x="520" y="526.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">16 × 19</text><text x="640" y="526.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="526.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="965" y="526.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="40" y="572.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">Ballard × Bolsonaro</text><text x="290" y="572.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">frame</text><text x="520" y="572.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">19 × 8</text><text x="640" y="572.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="572.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="965" y="572.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="40" y="618.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">name_tag</text><text x="290" y="618.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">owner not in table</text><text x="520" y="618.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">13 × 7</text><text x="640" y="618.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="618.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="965" y="618.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="40" y="664.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">Holland order 2</text><text x="290" y="664.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">owner not in table</text><text x="520" y="664.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">9 × 8</text><text x="640" y="664.4" font-size="20" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">none</text><text x="845" y="664.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><text x="965" y="664.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve"></text><rect x="40" y="715" width="18" height="18" fill="rgb(232,242,234)" stroke="rgb(105,105,112)" stroke-width="1"/><text x="68" y="725.9" font-size="17" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">has an m</text><rect x="180.421875" y="715" width="18.0" height="18" fill="rgb(250,248,243)" stroke="rgb(105,105,112)" stroke-width="1"/><text x="208.421875" y="725.9" font-size="17" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">no m</text><text x="288.078125" y="725.9" font-size="17" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">λ = how often the other guests meet, on m&#x27;s posts</text><text x="40" y="789.3" font-size="26" font-weight="700" fill="rgb(190,30,40)" xml:space="preserve">What the table shows</text><text x="40" y="826.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">The three with an m share one shape: a point nothing else can stand in for, a rigid recurring part,</text><text x="40" y="857.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">and every leftover symmetry from forced or weight-one rooms (P1 rigid grid and relay; P2, same shape).</text><text x="40" y="888.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">The six without one are frames or co-host pairs whose ownership splits: no single owner holds the crew.</text><text x="40" y="919.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">In the grid and the relay, m owns every post, so holding every guest comes free. Only S16 also</text><text x="40" y="950.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">seats the crew evenly (2, 2, 2): expofamily.cl, not Sandra, the raw ownership leader with 6.</text><text x="40" y="1006.6" font-size="19" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">Computed: the table.   Shapes: P1 (rigid grid, relay), P2.   Proved: at most one monkey.</text><text x="40" y="1038.6" font-size="19" font-weight="700" fill="rgb(190,30,40)" xml:space="preserve">Not claimed: </text><text x="160.765625" y="1038.6" font-size="19" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">whether m is a robot.</text><text x="40" y="1126.3" font-size="15" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">Robot = any account other than m: a role in the structure, not a statement about who or what runs an account.</text><text x="40" y="1150.3" font-size="15" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">Data and checker: github.com/AntMerrill/backfire-tracking, docs/data/grid-relay-m (python3 -I m_check.py).</text></svg>