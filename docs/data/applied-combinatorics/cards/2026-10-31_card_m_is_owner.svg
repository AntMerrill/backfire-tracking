"381" width="28" height="28" fill="rgb(222,220,214)"/><rect x="732" y="381" width="28" height="28" fill="rgb(222,220,214)"/><rect x="768" y="381" width="28" height="28" fill="rgb(222,220,214)"/><rect x="804" y="381" width="28" height="28" fill="rgb(222,220,214)"/><text x="854" y="398.8" font-size="18" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">crew: 0 of 4</text><text x="40" y="440.4" font-size="20" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">ivetteavaria</text><rect x="264" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="300" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="336" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="372" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="408" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="444" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="480" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="516" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="552" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="588" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="624" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="660" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="696" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="732" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="768" y="421" width="28" height="28" fill="rgb(222,220,214)"/><rect x="804" y="421" width="28" height="28" fill="rgb(40,90,170)"/><text x="854" y="438.8" font-size="18" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">crew: 0 of 4</text><rect x="40" y="468" width="16" height="16" fill="rgb(40,90,170)"/><text x="64" y="478.1" font-size="16" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">post owned by that account</text><rect x="330" y="468" width="16" height="16" fill="rgb(200,140,20)"/><text x="354" y="478.1" font-size="16" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">owned by expofamily.cl</text><text x="40" y="533.0" font-size="22" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">Sandra Bronzina owns the most posts (6), and none of the crew sits only on them.</text><text x="40" y="565.0" font-size="22" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">Tim Ballard owns one post (#8). Only expofamily.cl&#x27;s posts, #11 to #15, hold the whole crew:</text><text x="40" y="597.0" font-size="22" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">dramariajosemancino, margaritarojoc, qntlc, sharing 2, 2 and 2 posts pair by pair.</text><text x="40" y="661.2" font-size="32" font-weight="700" fill="rgb(200,140,20)" xml:space="preserve">m = expofamily.cl</text><text x="40" y="700.2" font-size="21" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">m is defined by ownership: the account whose posts every regular guest sits on (it was x in P2).</text><text x="40" y="766.3" font-size="26" font-weight="700" fill="rgb(190,30,40)" xml:space="preserve">What follows</text><text x="40" y="806.2" font-size="21" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">Proved.</text><text x="200" y="806.2" font-size="21" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">At most one monkey (a human operator) in a cast Holland object: m itself.</text><text x="40" y="840.2" font-size="21" font-weight="700" fill="rgb(35,130,80)" xml:space="preserve">Proved.</text><text x="200" y="840.2" font-size="21" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">Every account other than m is a robot. In S16: the other 14 accounts.</text><text x="40" y="874.2" font-size="21" font-weight="700" fill="rgb(25,25,30)" xml:space="preserve">Also:</text><text x="200" y="874.2" font-size="21" font-weight="400" fill="rgb(25,25,30)" xml:space="preserve">In latterdayavenger&#x27;s grid he owns all 354 posts, so he is m; the other 112 are robots.</text><text x="40" y="908.2" font-size="21" font-weight="700" fill="rgb(105,105,112)" xml:space="preserve">Not claimed:</text><text x="200" y="908.2" font-size="21" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">whether m is a robot.</text><text x="40" y="1297.1" font-size="16" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">Robot = any account other than m: a role in the structure, not a statement about who or what runs an account.</text><text x="40" y="1321.1" font-size="16" font-weight="400" fill="rgb(105,105,112)" xml:space="preserve">Data and checkers: github.com/AntMerrill/backfire-tracking, docs/data (holland24, who-went-first, tb-collabs, for-agents).</text></svg>